name: Baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    uses: metio/ci/.github/workflows/baseline.yml@950bfa5db1cddb933f0aeb6e53324f100d9ec41b # 2026.11.26194834
  baseline:
    name: Baseline
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: '[ "$RESULT" = success ] || { echo "::error::the baseline checks ended in $RESULT"; exit 1; }'
